[package]
name = "frostbit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Frozen, mmap-friendly, zero-copy roaring bitmaps with fast set operations."

[dependencies]
aligned-vec = "0.6"
bytemuck = { version = "1", features = ["derive"] }
roaring = { version = "0.11", optional = true }

[features]
default = ["roaring"]
# Conversions to/from roaring::RoaringBitmap.
roaring = ["dep:roaring"]
# Exposes internal modules (byte/format helpers, arena, plan, …) for white-box
# tests and benchmarks. NOT part of the stable public API — may change anytime.
internals = []
# Build the roaring baseline with its SIMD enabled (nightly only) for a fair
# SIMD-vs-SIMD bench: `cargo +nightly bench --features roaring-simd`.
roaring-simd = ["roaring", "roaring/simd"]

[dev-dependencies]
criterion = "0.5"

# Op kernel tests live in tests/ops/{intersect,union,diff}.rs under one target.
[[test]]
name = "ops"
path = "tests/ops/main.rs"

# Benchmarks vs roaring (the `roaring` feature is on by default).
[[bench]]
name = "ops"
path = "benchmarks/ops.rs"
harness = false
required-features = ["roaring"]

[[bench]]
name = "trees"
path = "benchmarks/trees.rs"
harness = false
required-features = ["roaring"]

# Keep 10M-element round-trip tests fast under `cargo test`.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# Benches reflect production builds.
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
